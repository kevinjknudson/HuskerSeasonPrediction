name: Update standings

on:
  schedule:
    # Every 20 minutes, August through January. Times are UTC.
    - cron: "*/20 * * 8,9,10,11,12,1 *"
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
  push:
    paths:
      - "config.json"       # re-run whenever you change settings or an override

permissions:
  contents: write

concurrency:
  group: standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect results and recalculate
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/update.py

      - name: Commit if anything changed
        run: |
          git config user.name  "husker-pool-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # standings.json is fully derived, so on a push race the right move is
          # to take the newest remote state and lay our freshly built file on top
          # — never a merge, which could conflict on generated content.
          cp data/standings.json /tmp/standings.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/standings.json data/standings.json
            git add data/standings.json

            if git diff --staged --quiet; then
              echo "No change."
              exit 0
            fi

            git commit -m "Standings update $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected — remote moved while we were running. Retrying."
            sleep 5
          done

          echo "Could not push after 3 attempts."
          exit 1
