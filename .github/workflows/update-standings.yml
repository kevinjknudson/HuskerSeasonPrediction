name: Update standings

on:
  schedule:
    # Every 20 minutes, August through January. Times are UTC.
    - cron: "*/20 * * 8,9,10,11,12,1 *"
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
  push:
    paths:
      - "config.json"       # re-run whenever you change settings or an override

permissions:
  contents: write

concurrency:
  group: standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect results and recalculate
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/update.py

      - name: Commit if anything changed
        run: |
          git config user.name  "husker-pool-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Standings update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
